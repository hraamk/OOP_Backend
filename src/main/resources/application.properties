spring.application.name=ticket-pool-simulation
spring.data.mongodb.uri=mongodb+srv://Hariraam:hariraam@ticketingapplication.uvnb9.mongodb.net/?retryWrites=true&w=majority&appName=TicketingApplication
spring.data.mongodb.database=TicketingApp

logging.level.com.ticketing=DEBUG

spring.main.banner-mode=off

server.port=8080

# WebSocket Configuration
spring.websocket.max-text-message-size=32768
spring.websocket.max-binary-message-size=32768

# Logging Configuration
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.socket=TRACE
logging.level.org.springframework.messaging=TRACE
logging.level.com.ticketing.simulation=DEBUG

# CORS Configuration
spring.mvc.cors.allowed-origins=http://localhost:4200,http://localhost:3000
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true
spring.mvc.cors.max-age=3600